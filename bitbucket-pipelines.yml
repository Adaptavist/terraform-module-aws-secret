definitions:
  tests: &test
    name: Tests
    image: adaptavist/terraform:alpine-0.12.8-dev
    script:
      - (echo ${PIPELINE_GIT_PRIVATE_KEY} | base64 -d >> ~/.ssh/id_rsa) && chmod 0600 ~/.ssh/id_rsa
      - terraform fmt -check -recursive -diff

  release: &release
      name: release
      image: node:26-slim
      script:
        - apt-get update && apt-get install -y --no-install-recommends git openssh-client ca-certificates
        - mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts
        - npx -y -p semantic-release@26.0.1 -p @semantic-release/changelog@7.0.0 -p @semantic-release/git@11.0.1 -p @semantic-release/exec@7.1.0 semantic-release -r ${BITBUCKET_GIT_HTTP_ORIGIN}

  checkov-image: &checkov-image
    name: bridgecrew/checkov:latest
    entrypoint:
      - '/usr/bin/env'
      - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

  scripts:
    - &checkov >
      checkov --quiet --compact -s -d . -o github_failed_only > compliance-issues.md &&
      checkov --quiet --compact -s -d .

pipelines:
  default:
    - step: *test
    - step: { name: 'Checkov analysis', script: [ *checkov ], image: *checkov-image, services: [ docker ] } 
  branches:
    master:
      - step: *test
      - step: *release